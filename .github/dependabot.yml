version: 2
updates:
  # npm packages — the root lockfile covers the apps/web workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Bundle minor/patch bumps into one PR; majors still come one per PR
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Versions of actions used in .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
